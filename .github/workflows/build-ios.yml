name: Build iOS

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: "Which app variant to build"
        type: choice
        default: cakewallet
        options: [cakewallet, monero.com]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    env:
      APP_IOS_TYPE: ${{ inputs.app_type }}
      # The monero_c release whose prebuilt libraries we use. This must match
      # the commit prepare_moneroc.sh checks out -- the note in that file names
      # this exact release, which is what it is there for.
      MONEROC_RELEASE: v0.18.4.6-RC2
      # Likewise for torch, named in the comment at the top of
      # scripts/prepare_torch.sh and used by Cake's own lint workflow.
      TORCH_RELEASE: v1.0.17
      # pubspec_base.yaml takes reown_walletkit from
      # scripts/reown_flutter/packages/reown_walletkit, which does not ship in
      # the source. prepare_reown.sh clones and then runs generate_all.sh;
      # this release is that work already done, and is what lint.yml fetches.
      REOWN_RELEASE: v0.0.4
      # cw_bitcoin, cw_evm and pubspec_base all take bitbox_flutter from
      # scripts/bitbox_flutter. Pinned in scripts/build_bitbox_flutter.sh.
      BITBOX_COMMIT: 5a6e6dd388ef64003f86094af80d5453518b601d

    steps:
      - uses: actions/checkout@v4

      # Every .sh here lost its executable bit: the source came from a Windows
      # zip and was committed from Windows, so git recorded mode 644 and the
      # runner refuses to exec them. The scripts also call each other, so this
      # has to cover the tree rather than just the entry points.
      - name: Make scripts executable
        run: find . -type f -name "*.sh" -exec chmod +x {} +

      # Cake's own CI runs this image:
      #   ghcr.io/cake-tech/cake_wallet:debian13-flutter3.41.9-ndkr28-go1.24.1-...
      # (.github/workflows/reusable-build.yml, lint.yml, pr_test_build_linux.yml)
      # so 3.41.9 is the version this source is actually built with.
      #
      # scripts/linux/.fvmrc says 3.27.4 and is stale. The committed lockfiles
      # settle it: cw_decred and cw_wownero record dart ">=3.10.0", which rules
      # out 3.27.4 (Dart 3.6.2) and 3.35.7 (Dart 3.9.2) alike. 3.41.9 ships
      # Dart 3.12.2.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # decred and mwebd are Go. cw_mweb/go/go.mod requires 1.24.1 and
      # build_mwebd.sh's own --install branch says "install go > 1.24";
      # decred's libwallet asks for 1.22, which 1.24 satisfies. Go would
      # auto-download a newer toolchain on demand, but pinning it here keeps
      # that out of the middle of a cgo cross-compile.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # cw_zcash pulls zkool from git, and zkool builds Rust during the Xcode
      # phase via Cargokit, which shells out to rustup. The runner ships rustup
      # but the build died inside it:
      #
      #   component download failed for rust-std-aarch64-apple-ios: could not
      #   rename 'downloaded' file from ~/.rustup/downloads/....partial
      #   No such file or directory (os error 2)
      #
      # -- rustup's working directories were missing. Installing the target
      # here means Cargokit finds it already present and never runs that
      # download, and if rustup is broken beyond a mkdir we find out in this
      # cheap step rather than 40 minutes into the build.
      - name: Rust toolchain for zkool
        run: |
          set -eux
          mkdir -p "$HOME/.rustup/downloads" "$HOME/.rustup/tmp"
          if ! rustup target add aarch64-apple-ios; then
            echo "rustup unhealthy, reinstalling"
            rm -rf "$HOME/.rustup"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs               | sh -s -- -y --no-modify-path --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup target add aarch64-apple-ios
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target list --installed
          rustc --version

      - name: Show toolchain
        run: |
          flutter --version
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # monero_c is still needed as a checkout: gen_framework.sh reads its git
      # tag to work out where the libraries live.
      - name: Prepare monero_c
        working-directory: scripts
        run: ./prepare_moneroc.sh

      # Use the published libraries instead of compiling Monero.
      #
      # Compiling monero_c for iOS cannot work on a hosted runner. Its depends
      # system needs Apple's iOS SDK, which Apple does not allow anyone to
      # redistribute, so it tries to download Xcode 26.1 and extract the SDK
      # itself. That download needs a signed-in Apple developer session; without
      # one Apple serves an 82KB login page, the SHA256 check fails, and it
      # retries fifteen times before dying. The runner only carries up to Xcode
      # 16.2 in any case, so even an authenticated download could not satisfy
      # the version it asks for.
      #
      # The project publishes these libraries already built, and
      # prepare_moneroc.sh names the release in a comment. The bundle's layout
      # is exactly what gen_framework.sh looks for, so this puts them where the
      # compile would have left them.
      - name: Fetch prebuilt monero_c libraries
        run: |
          set -eux
          TAG=$(cd scripts/monero_c && git describe --tags)
          echo "gen_framework.sh will look under release/$TAG"

          curl -sSL -o /tmp/monero_c.zip \
            "https://github.com/MrCyjaneK/monero_c/releases/download/${MONEROC_RELEASE}/release-bundle.zip"
          mkdir -p /tmp/mc && unzip -q /tmp/monero_c.zip -d /tmp/mc

          # The folder inside the bundle is named for the release, which is not
          # necessarily what `git describe --tags` returns for the pinned
          # commit. Copy by content rather than trusting the two to match.
          SRC=$(find /tmp/mc -maxdepth 1 -mindepth 1 -type d | head -1)
          DEST="scripts/monero_c/release/$TAG"
          mkdir -p "$DEST"
          cp -R "$SRC"/* "$DEST"/

          echo "== what gen_framework.sh will find =="
          ls -la "$DEST/aarch64-apple-ios" "$DEST/aarch64-apple-ios-simulator"

      # Same story as monero_c, different library. build_torch.sh clones
      # simplybs, a bootstrap build system that compiles its own toolchain --
      # its own make, bash, autoconf -- before it builds Tor. On the macos-14
      # runner its bootstrapped dash segfaults while configuring GNU make, so
      # the build system fails to build its own tools and never reaches Tor.
      #
      # torch_dart publishes the finished package, and prepare_torch.sh names
      # this exact release in a comment for that purpose. The tarball carries
      # ios/LibTorch.xcframework with both the device and simulator slices,
      # which is what build.sh would have produced.
      #
      # The pinned commit is 20 commits ahead of this tag, but every one of
      # them touches only build tooling (build.sh, create-xcframework.sh, the
      # release workflow). No Dart and no C source differs, so the published
      # package is what the pinned commit builds.
      - name: Fetch prebuilt torch
        working-directory: scripts
        run: |
          set -eux
          curl -sSL -o torch_dart.tar.gz             "https://github.com/MrCyjaneK/torch_dart/releases/download/${TORCH_RELEASE}/torch_dart-${TORCH_RELEASE}.tar.gz"
          rm -rf torch_dart
          mkdir torch_dart
          tar -xzf torch_dart.tar.gz -C torch_dart
          rm torch_dart.tar.gz

          echo "== the framework the pods will link =="
          ls -la torch_dart/ios/LibTorch.xcframework

      # What is left of build_all.sh: the frameworks wrapped around the
      # prebuilt dylibs, then the two Go libraries.
      - name: Build remaining native libraries
        working-directory: scripts/ios
        run: |
          set -eux
          source ./app_env.sh "$APP_IOS_TYPE"
          ./gen_framework.sh
          ./build_mwebd.sh
          ./build_decred.sh

      # build_mwebd.sh ends by regenerating the mweb FFI bindings, and it
      # silently produces an empty file:
      #
      #   [INFO] : Input Headers: []
      #   [INFO] : Finished, Bindings generated in lib/generated_bindings.g.dart
      #
      # so mweb_ffi.dart then fails to compile with "MWebFlutter isn't a type".
      # ffigen exits 0 on an empty header list, so set -e does not catch it.
      #
      # Two bugs in that script conspire. Its sed looks for
      # ".../arm64-v8a/mweb.h" while ffigen_config.yaml says "libmweb.h", so
      # the substitution never matches; and the following "mv $CONFIG.bak
      # $CONFIG" restores the original file, which would have undone the edit
      # anyway. ffigen is left reading the Android header path, which holds
      # only a .gitkeep in this source.
      #
      # Point it at the header build_mwebd.sh actually produced and rerun.
      - name: Regenerate mweb FFI bindings
        working-directory: cw_mweb
        run: |
          set -eux
          HDR="ios/Mwebd.xcframework/ios-arm64/Mwebd.framework/Headers/Mwebd.h"
          test -s "$HDR"
          sed -i.orig "s|^ *- .*libmweb\.h.*|    - '$HDR'|" ffigen_config.yaml
          cat ffigen_config.yaml
          dart run ffigen --config ffigen_config.yaml
          grep -q "class MWebFlutter" lib/generated_bindings.g.dart
          echo "MWebFlutter generated OK"

      - name: Fetch prebuilt reown
        working-directory: scripts
        run: |
          set -eux
          curl -sSL -o reown_flutter.tar.gz             "https://github.com/cake-tech/reown_flutter/releases/download/${REOWN_RELEASE}/reown_flutter-${REOWN_RELEASE}.tar.gz"
          rm -rf reown_flutter
          mkdir reown_flutter
          tar -xzf reown_flutter.tar.gz -C reown_flutter
          rm reown_flutter.tar.gz
          ls -d reown_flutter/packages/reown_walletkit

      # Only the Dart package is needed here. build_bitbox_flutter.sh also runs
      # build_bindings.sh, which is "gomobile bind -target=android" and builds
      # api.aar -- Android only. The iOS side is ios/bitbox_flutter.podspec,
      # which is plain source files with no vendored framework.
      - name: Prepare bitbox_flutter
        working-directory: scripts
        run: |
          set -eux
          rm -rf bitbox_flutter
          git clone https://github.com/konstantinullrich/bitbox_flutter
          cd bitbox_flutter
          git checkout "$BITBOX_COMMIT"
          ls ios/bitbox_flutter.podspec pubspec.yaml

      # Writes Info.plist, sets the bundle id, generates pubspec.yaml and runs
      # tool/configure.dart for the coin set.
      - name: Configure app
        working-directory: scripts/ios
        run: |
          set -eux
          source ./app_env.sh "$APP_IOS_TYPE"
          ./app_config.sh

      # Every .secrets.g.dart is generated, and none ship in the source, so
      # the Dart compile fails on 62 undefined names -- etherScanApiKey,
      # moralisApiKey, walletSalt and so on. Cake's CI injects them from
      # GitHub secrets in reusable-build.yml; this repo has none of those
      # keys, and does not need working exchange or block-explorer APIs.
      #
      # tool/generate_new_secrets.dart is the project's own generator. It
      # writes every name the code references: random hex for the salts and
      # keys, empty strings for the third-party API keys. Everything is
      # emitted as a String, so nothing is left mistyped.
      #
      # cw_core imports no secrets but Cake's CI touches the file, so match
      # that rather than find out later.
      - name: Generate secrets
        run: |
          set -eux
          dart run tool/generate_new_secrets.dart
          touch cw_core/lib/.secrets.g.dart

          # import_secrets_config.dart declares bitcoinConfigPath and
          # bitcoinOutputPath and then never uses them, so cw_bitcoin is the
          # one package it does not write, and bitcoin_wallet.dart fails on
          # breezApiKey. Cake's CI echoes that key in by hand for the same
          # reason. Write it from the config the generator does produce, so
          # this keeps working if bitcoinSecrets ever grows.
          python3 - <<'PYEOF'
          import json
          cfg = json.load(open('tool/.bitcoin-secrets-config.json'))
          with open('cw_bitcoin/lib/.secrets.g.dart', 'w') as f:
              for k, v in cfg.items():
                  print("const %s = '%s';" % (k, v), file=f)
          print('wrote', len(cfg), 'consts to cw_bitcoin')
          PYEOF

          # A bare "wc -l" inside an echo cannot fail the step, which is how
          # the missing cw_bitcoin file slipped through last time. Assert.
          for f in lib cw_evm/lib cw_solana/lib cw_nano/lib cw_tron/lib cw_bitcoin/lib; do
            test -s "$f/.secrets.g.dart" || { echo "EMPTY OR MISSING: $f/.secrets.g.dart"; exit 1; }
            echo "$f: $(wc -l < "$f/.secrets.g.dart") consts"
          done

      # This mirrors reusable-build.yml, which is what Cake actually runs.
      # Our old single "dart run build_runner build" at the repo root was not
      # enough: model_generator.sh runs build_runner inside each cw_* package
      # too, and nothing in this tree is committed pre-generated (0 .g.dart
      # files anywhere).
      #
      # Run it synchronously rather than with the "async" argument Cake passes.
      # model_generator.sh backgrounds every package with & and never waits, so
      # the root build_runner can start while packages are still generating.
      # That is a race worth avoiding; the repo is public, so the extra minutes
      # are free.
      - name: Generate Dart code
        run: |
          set -eux
          flutter pub get
          flutter clean
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter pub get
          ./model_generator.sh

      # 31 .arb files in res/values, and lib/generated is empty in the source.
      # i18n.dart and locales.dart do not exist until this runs.
      - name: Generate localization
        run: dart run tool/generate_localization.dart

      # Not cosmetic. pubspec_base.yaml declares assets/new-ui/ plus 20
      # subdirectories, and 19 of them do not exist in the source -- Flutter
      # fails outright on a declared asset directory that is missing. This
      # compiles 354 svgs out of res/pictures into assets/new-ui, creating
      # them. cake_image_widget.dart loads the .vec files it produces.
      - name: Compile graphics
        run: ./compile_graphics.sh

      # The runner has Xcode 15.4, but this source ships its app icons in the
      # .icon Icon Composer format -- SVGs plus icon.json -- which is Xcode 26
      # only. Assets.xcassets therefore has no AppIcon.appiconset, while the
      # project still sets ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon, so
      # actool fails:
      #
      #   None of the input catalogs contained a matching stickers icon set
      #   or app icon set named "AppIcon".
      #
      # Build a classic single-size appiconset from the 1024 PNG the repo
      # already carries. iOS app icons may not have an alpha channel and that
      # PNG is RGBA, so flatten it through JPEG first -- sips has no direct
      # way to drop alpha.
      - name: Build AppIcon asset catalog
        run: |
          set -eux
          case "$APP_IOS_TYPE" in
            "monero.com") SRC=assets/images/monero.com_icon_1024.png ;;
            *)            SRC=assets/images/cakewallet_icon_1024.png ;;
          esac
          test -s "$SRC"

          DEST=ios/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$DEST"
          sips -s format jpeg -s formatOptions best "$SRC" --out "$RUNNER_TEMP/icon.jpg"
          sips -s format png "$RUNNER_TEMP/icon.jpg" --out "$DEST/Icon-1024.png"

          cat > "$DEST/Contents.json" <<'JSONEOF'
          {
            "images" : [
              {
                "filename" : "Icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          JSONEOF

          ls -la "$DEST"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$DEST/Icon-1024.png"

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # No signing identity on a hosted runner, so this is built unsigned.
      # Sideloadly re-signs it with your own Apple ID at install time.
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign

      # An .ipa is a zip with the .app inside a folder called Payload.
      - name: Package IPA
        run: |
          set -eux
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$RUNNER_TEMP/app-unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/app-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned
          path: ${{ runner.temp }}/app-unsigned.ipa
          retention-days: 14
